<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Restaurante - RanGo</title>
</head>

<body>

    <h1>Cadastrar novo restaurante</h1>

    <form th:action="@{/restaurantes}"
          th:object="${restaurante}"
          method="post">

        <p>
            <label for="nome">Nome:</label>
            <input type="text"
                   id="nome"
                   th:field="*{nome}"
                   required>
        </p>

        <p>
            <label for="endereco">Endereço:</label>
            <input type="text"
                   id="endereco"
                   th:field="*{endereco}"
                   required>
        </p>

        <p>
            <label for="bairro">Bairro:</label>
            <input type="text"
                   id="bairro"
                   th:field="*{bairro}"
                   required>
        </p>

        <p>
            <label for="categoria">Categoria:</label>
            <input type="text"
                   id="categoria"
                   th:field="*{categoria}"
                   required>
        </p>

        <p>
            <label for="descricao">Descrição:</label>
            <textarea id="descricao"
                      th:field="*{descricao}"
                      rows="4"></textarea>
        </p>

        <button type="submit">Salvar restaurante</button>

    </form>

    <p>
        <a th:href="@{/restaurantes}">
            Voltar para restaurantes
        </a>
    </p>

</body>
</html>
